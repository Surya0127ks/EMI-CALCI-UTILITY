name: Build and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build static site and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: emi-calci-utility
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
      NEXT_PUBLIC_ADSENSE_SLOT_TOOL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_TOOL }}
      NEXT_PUBLIC_ADSENSE_SLOT_CONTENT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_CONTENT }}
      NEXT_PUBLIC_ADSENSE_SLOT_BOTTOM: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_BOTTOM }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions secrets, then run this workflow again."
          fi

      - name: Create or find Pages project
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/ensure-pages-project.mjs

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=emi-calci-utility --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
